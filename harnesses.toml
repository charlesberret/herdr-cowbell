# cowbell — the constitution of the herd.
#
# A harness is a way of raising an agent: which executable, which model, which
# lane (write/bash knobs), which tools, and which trust surface it answers to.
# cowbell reads this file to know what *may* be raised in a directory; the
# roster (state dir, roster.json) records what *has* been raised and where.
#
# Edit freely. This is the copy in your plugin config dir; the plugin root
# ships a seed that is only copied here when this file is absent.
#
# Lanes are the house shorthand for write/bash knobs (trust-register.md):
# they are not a trust model. Trust verdicts come from `agent-deck-trust match`.

[defaults]
lane = "yellow"

# lane -> extra argv, per native kind. Wrappers (family local/oll/wk/bt) bake
# their lane into the wrapper and ignore this table.
[lanes.claude]
green  = ["--permission-mode", "plan"]
yellow = ["--permission-mode", "acceptEdits"]
red    = ["--permission-mode", "bypassPermissions"]

[lanes.grok]
# grok --help 2026-09-12: plan, acceptEdits, default, auto, dontAsk, bypassPermissions.
green  = ["--permission-mode", "plan"]
yellow = ["--permission-mode", "acceptEdits"]
red    = ["--always-approve"]

[lanes.pi]
green  = ["--tools", "read"]
yellow = ["--tools", "read,edit,write"]
red    = []

# ---------------------------------------------------------------------------
# Native kinds — herdr starts these itself (`herdr agent start --kind`), so
# the sidebar reports working / blocked / idle.
# ---------------------------------------------------------------------------

[[harness]]
id = "claude"
kind = "claude"
title = "Claude Code"
family = "claude"
egress = "vendor"
trust_tool = "claude"
models = ["claude-sonnet-5", "claude-opus-5", "claude-fable-5-1", "claude-haiku-4-5-20251001"]
model_flag = ["--model"]
resume = ["--resume"]
tools_allow_flag = "--allowedTools"
tools_deny_flag = "--disallowedTools"
seat_flag = "--append-system-prompt-file"

[[harness]]
id = "grok"
kind = "grok"
title = "Grok CLI"
family = "grok"
egress = "vendor"
trust_tool = "grok"
models = []
model_flag = ["-m"]
resume = ["--resume"]
tools_allow_flag = "--allowedTools"
tools_deny_flag = "--disallowed-tools"
claim_flag = "--agent"   # sitting head (`builder-minaret` → builder) when ~/.grok/agents/<word>.md exists

[[harness]]
id = "agy"
kind = "agy"
title = "Antigravity (Gemini)"
family = "gemini"
egress = "vendor"
trust_tool = "agy"
models = []
resume = ["--conversation"]

[[harness]]
id = "pi"
kind = "pi"
title = "pi (bare)"
family = "pi"
egress = "vendor"
trust_tool = "pi"
models = []
model_flag = ["--model"]
resume = ["--continue"]
tools_allow_flag = "--tools"
seat_flag = "--append-system-prompt"

# ---------------------------------------------------------------------------
# House wrappers — pi launchers with the lane, model, and SEAT.md injection
# baked in (code/bin/lib/pi-project-seat.sh). Raised with `herdr pane run`;
# herdr may detect pi inside, but treat their status as advisory.
# Ladder and egress: system/remote-nerve/remote-nerve-center.md.
