# cowbell — which agents can be started, and how.
#
# This is the seed that ships with cowbell. It is copied to ~/.config/cowbell/
# (COWBELL_CONFIG_DIR, or $XDG_CONFIG_HOME/cowbell) the first time cowbell runs,
# and that copy is the one to edit: add your own launchers, models, and presets.
# The herdr plugin and the `cowbell` command read the same copy.
# An agent that is not installed simply does not appear in the popup.
#
# Each [[harness]] is one way of starting an agent: the executable (a herdr agent
# kind, or a `command` wrapper), its models, and how it resumes a session.
# Optional: `trust_tool` names it to agent-deck-trust, if you use that; without
# the tool, cowbell shows no trust verdicts at all.

schema = 1           # file format; a newer cowbell may raise it, an older one will not write it

[defaults]
lane = "yellow"      # permissions preset used by Enter (quick start); `n` lets you choose
ask_name = false     # true: Enter asks for a tab name before starting

# Permissions presets ("lanes"): green = read / plan, yellow = edits allowed,
# red = no prompts. Extra argv per agent kind. A kind with no table starts with
# its own defaults. Wrappers (`command = ...`) bake permissions in and ignore this.
[lanes.claude]
green  = ["--permission-mode", "plan"]
yellow = ["--permission-mode", "acceptEdits"]
red    = ["--permission-mode", "bypassPermissions"]

[lanes.grok]
# grok --help 2026-09-12: plan, acceptEdits, default, auto, dontAsk, bypassPermissions.
green  = ["--permission-mode", "plan"]
yellow = ["--permission-mode", "acceptEdits"]
red    = ["--always-approve"]

[lanes.codex]
# Codex CLI sandbox flags (not verified against an installed codex here).
green  = ["--sandbox", "read-only"]
yellow = ["--sandbox", "workspace-write"]
red    = ["--dangerously-bypass-approvals-and-sandbox"]

[lanes.pi]
green  = ["--tools", "read"]
yellow = ["--tools", "read,edit,write"]
red    = []

[[harness]]
id = "claude"
kind = "claude"
title = "Claude Code"
models = ["claude-sonnet-5", "claude-opus-5", "claude-fable-5-1", "claude-haiku-4-5-20251001"]
model_flag = ["--model"]
resume = ["--resume"]
tools_allow_flag = "--allowedTools"
tools_deny_flag = "--disallowedTools"
seat_flag = "--append-system-prompt-file"   # used only when a SEAT.md is found at or above the directory
session_id_flag = "--session-id"   # outside herdr: cowbell picks the id so it can resume later
name_flag = "--name"               # outside herdr: the sitting name as the session display name

[[harness]]
id = "codex"
kind = "codex"
title = "Codex"
models = []
model_flag = ["--model"]
resume = ["resume"]   # a subcommand, not a flag

[[harness]]
id = "grok"
kind = "grok"
title = "Grok CLI"
models = []
model_flag = ["-m"]
resume = ["--resume"]
tools_allow_flag = "--allowedTools"
tools_deny_flag = "--disallowed-tools"
claim_flag = "--agent"   # passes --agent <name> only when ~/.grok/agents/<name>.md exists

[[harness]]
id = "gemini"
kind = "gemini"
title = "Gemini CLI"
models = []
resume = []

[[harness]]
id = "agy"
kind = "agy"
title = "Antigravity (Gemini)"
models = []
resume = ["--conversation"]

[[harness]]
id = "opencode"
kind = "opencode"
title = "OpenCode"
models = []
resume = ["--session"]

[[harness]]
id = "pi"
kind = "pi"
title = "pi"
models = []
model_flag = ["--model"]
resume = ["--continue"]
tools_allow_flag = "--tools"
