# cowbell — which agents can be started, and how.
#
# This is the seed that ships with cowbell. It is copied to ~/.config/cowbell/
# (COWBELL_CONFIG_DIR, or $XDG_CONFIG_HOME/cowbell) the first time cowbell runs,
# and that copy is the one to edit: add your own launchers, models, and presets.
# The herdr plugin and the `cowbell` command read the same copy.
# An agent that is not installed simply does not appear in the popup.
#
# Each [[harness]] is one way of starting an agent: the executable (a herdr agent
# kind, or a `command` wrapper), its models, and how it resumes a session.
# Optional: `trust_tool` is the name this harness answers to when a trust checker
# is asked about it (see [defaults] trust_command); without such a checker on PATH,
# cowbell shows no trust verdicts at all.
#
# Resuming outside herdr: a harness is resume-capable in a plain terminal only
# when cowbell can choose its session id (`session_id_flag`), start with that id,
# and replay it later. claude is the one seeded harness that is resume-capable
# outside herdr; every other seeded harness is honestly absent from Resume when
# raised outside herdr — its CLI picks its own session id, which cowbell cannot
# set or replay. (Raised under herdr, session ids are observed and replay works
# for any harness that has a `resume` spec.) `cowbell list` still shows every
# row; Resume just does not offer what it cannot resume.
#
# A place ([places.<name>]) can limit which harnesses start there, and can
# drop to another unix account. This seed ships no place table. Copy the
# example below into this file (uncommented) if you want one.
#
# [[harness]]
# id = "lab"
# kind = "lab"
# title = "Lab shell"
# command = "/bin/bash"
#
# [places.lab]
# cwd = "~/lab"
# allow_harness = ["lab"]
# default_harness = "lab"
# unix_user = "lab"
# require_uid = true
# nono_profile = "~/.config/nono/lab.json"
#
# unix_user is an account name (getpwnam). When the process is not already
# that user, cowbell prefixes `agent-run <user> --` if agent-run is on PATH,
# otherwise `sudo -u <user> --`. require_uid = true with no unix_user refuses
# to start. nono_profile, when set, wraps the command in nono inside that
# drop. Omit nono_profile if you do not use nono.

schema = 1           # file format; a newer cowbell may raise it, an older one will not write it

[defaults]
# Two hooks onto tools cowbell does not own. Both are optional.
# trust_command  a program asked `subject <path>`, `match <tool> <path>` and
#                `badge <tool>`; exit 4 refuses, 3 warns. Not on PATH: no verdicts.
# seat_file      a briefing file looked for by walking up from the directory and
#                handed to a harness through its system_prompt_flag.
# session_history  "on" lets cowbell read the harnesses' own session stores
#                  (~/.claude/projects, ~/.grok/sessions) so Resume knows every
#                  session this directory has seen, not only the ones cowbell
#                  started. Metadata only — id, times, title. "all" also lists
#                  agents a sitting dispatched (role prompts). Default "off".
session_history = "off"        # off · on · all

trust_command = "harness-trust"
seat_file = "SEAT.md"

lane = "yellow"      # permissions preset used by Enter (quick start); `n` lets you choose
ask_name = false     # true: Enter asks for a tab name before starting

# Permissions presets ("lanes"): green = read / plan, yellow = edits allowed,
# red = no prompts. Extra argv per agent kind. A kind with no table starts with
# its own defaults. Wrappers (`command = ...`) bake permissions in and ignore this.
[lanes.claude]
green  = ["--permission-mode", "plan"]
yellow = ["--permission-mode", "acceptEdits"]
red    = ["--permission-mode", "bypassPermissions"]

[lanes.grok]
# grok --help 2026-09-12: plan, acceptEdits, default, auto, dontAsk, bypassPermissions.
green  = ["--permission-mode", "plan"]
yellow = ["--permission-mode", "acceptEdits"]
red    = ["--always-approve"]

[lanes.codex]
# Verified 2026-10-05 against @openai/codex 0.160.1 (`npx`; not on PATH here).
# --sandbox values: read-only | workspace-write | danger-full-access.
# Red is the documented bypass (alias --yolo); long form only.
green  = ["--sandbox", "read-only"]
yellow = ["--sandbox", "workspace-write"]
red    = ["--dangerously-bypass-approvals-and-sandbox"]

[lanes.pi]
green  = ["--tools", "read"]
yellow = ["--tools", "read,edit,write"]
red    = []

[[harness]]
id = "claude"
kind = "claude"
title = "Claude Code"
models = ["claude-sonnet-5", "claude-opus-5", "claude-fable-5-1", "claude-haiku-4-5-20251001"]
model_flag = ["--model"]
resume = ["--resume"]
tools_allow_flag = "--allowedTools"
tools_deny_flag = "--disallowedTools"
system_prompt_flag = "--append-system-prompt-file"   # used only when a seat_file is found at or above the directory
session_id_flag = "--session-id"   # outside herdr: cowbell picks the id so it can resume later
name_flag = "--name"               # outside herdr: the sitting name as the session display name

[[harness]]
id = "codex"
kind = "codex"
title = "Codex"
models = []
model_flag = ["--model"]
resume = ["resume"]   # a subcommand, not a flag

[[harness]]
id = "grok"
kind = "grok"
title = "Grok CLI"
models = []
model_flag = ["-m"]
resume = ["--resume"]
tools_allow_flag = "--allowedTools"
tools_deny_flag = "--disallowed-tools"
claim_flag = "--agent"   # passes --agent <name> only when ~/.grok/agents/<name>.md exists

[[harness]]
id = "gemini"
kind = "gemini"
title = "Gemini CLI"
models = []
resume = []

[[harness]]
id = "agy"
kind = "agy"
title = "Antigravity (Gemini)"
models = []
resume = ["--conversation"]

[[harness]]
id = "opencode"
kind = "opencode"
title = "OpenCode"
models = []
resume = ["--session"]

[[harness]]
id = "pi"
kind = "pi"
title = "pi"
models = []
model_flag = ["--model"]
resume = ["--continue"]
tools_allow_flag = "--tools"
