id = "herdr-cowbell"
name = "cowbell"
version = "0.3.2"
min_herdr_version = "0.9.0"
description = "Launch or re-launch a coding agent in this directory with the model, effort, permissions and tools you choose, and see the exact command before it runs. Opens a popup; the agent lands in a herdr tab. Same picker as the cowbell command."
platforms = ["linux", "macos"]

# Every command starts with "./bin/cowbell": [[panes]] commands are resolved
# by PATH lookup, not relative to the plugin root, so a bare "bin/..." fails
# with plugin_pane_open_failed. The shim picks a python >= 3.11 (tomllib);
# macOS /usr/bin/python3 is 3.9 and must never be the one that runs this.

[[actions]]
id = "open"
title = "cowbell: registry for this directory"
contexts = ["global"]
command = ["./bin/cowbell", "open"]

[[actions]]
id = "adopt"
title = "cowbell: adopt the focused agent pane into the roster"
contexts = ["pane"]
command = ["./bin/cowbell", "adopt"]

[[actions]]
id = "install-keys"
title = "cowbell: bind prefix+c (new tab) to the registry"
contexts = ["global"]
command = ["./bin/cowbell", "keys", "install"]

[[actions]]
id = "uninstall-keys"
title = "cowbell: restore the built-in new-tab binding"
contexts = ["global"]
command = ["./bin/cowbell", "keys", "uninstall"]

[[actions]]
id = "install-font"
title = "cowbell: install the agent icon font (pinned, sha256 checked)"
contexts = ["global"]
command = ["./bin/cowbell", "font", "install"]

# One-shot: if the user has claimed prefix+c, put the binding back when a herdr
# upgrade rewrites config.toml. Does not steal the key until install-keys has run.
# No panes, no report-metadata, no clocks (LAB-297).
[[startup]]
command = ["./bin/cowbell", "keys", "ensure"]

# Overlay $glyph is not durable across a server restart. Restamp from live
# detector kind (plus Claude quota_model) with no TTL.
[[startup]]
command = ["./bin/cowbell", "identity", "stamp"]

# Occupancy: herdr already knows when the pane's agent changes. Restamp or
# clear $glyph from detector kind so a tab that exits grok and starts claude
# does not keep the grok mark. Event-driven; not a clock.
[[events]]
on = "pane.agent_detected"
command = ["./bin/cowbell", "identity", "sync"]

[[events]]
on = "pane.exited"
command = ["./bin/cowbell", "identity", "sync"]

# A long-lived pane can lose $glyph without another detect edge. Status
# changes re-publish only when the mark or the row name is wrong.
[[events]]
on = "pane.agent_status_changed"
command = ["./bin/cowbell", "identity", "sync"]

[[panes]]
id = "picker"
# Herdr draws the popup title against the inner left border and trims ordinary
# spaces. Two U+2800 pads (not whitespace) line "cowbell" up with the picker's
# two-space indent, flush with the leftmost text inside.
title = "\u2800\u2800cowbell"
placement = "popup"
width = "64%"
height = "56%"
command = ["./bin/cowbell", "picker"]
